# ============================================================================
# Grafana dashboard Provisioning configuration file
# Official documentation: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
# Used to automatically load and manage dashboards without manual import
# ============================================================================

# API version number
# Currently only version 1 is supported
apiVersion: 1

# Dashboard provider list
providers:
  - name: 'fba_server'
    orgId: 1
    type: 'file'
    disableDeletion: true
    editable: false
    options:
      path: '/etc/grafana/dashboards'
