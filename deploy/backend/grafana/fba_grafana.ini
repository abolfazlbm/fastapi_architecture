# ============================================================================
# ============================================================================
# ============================================================================
# ============================================================================

# ============================================================================
# ============================================================================
[server]
# ============================================================================
protocol = http

# ============================================================================
http_port = 3000

# ============================================================================
# ============================================================================
[security]
# ============================================================================
admin_user = admin

# ============================================================================
admin_password = CHANGE_ME

# ============================================================================
;cookie_secure = true

# ============================================================================
;allow_embedding = true

# ============================================================================
# ============================================================================
[users]
# ============================================================================
;login_hint = test

# ============================================================================
;password_hint = CHANGE_ME

# ============================================================================
default_theme = system

# ============================================================================
default_language = zh-Hans

# ============================================================================
# ============================================================================
[dashboards]
# ============================================================================
default_home_dashboard_path = /etc/grafana/dashboards/fba_server.json
