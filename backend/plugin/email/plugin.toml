[plugin]
summary = "eMail"
version = "0.0.3"
description = "Provides email sending function and supports verification codes, notifications and other scenarios"
author = "wu-clan"
tags = ["other"]
database = ["mysql", "postgresql"]

[app]
router = ["v1"]

[settings]
EMAIL_CAPTCHA_EXPIRE_SECONDS = 180  # 3 minute
EMAIL_CAPTCHA_REDIS_PREFIX = "fba:email:captcha"
EMAIL_HOST = "smtp.qq.com"
EMAIL_PORT = 465
EMAIL_SSL = true
